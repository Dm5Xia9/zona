[package]
name    = "zona-curl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zona-curl"
path = "src/main.rs"

[dependencies]
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
base64     = { workspace = true }
hex        = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
url        = "2.5"
tokio      = { workspace = true }
axum       = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen      = "0.13"
zona-p2p-crypto = { workspace = true }
