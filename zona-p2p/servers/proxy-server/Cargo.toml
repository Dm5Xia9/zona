[package]
name    = "proxy-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proxy-server"
path = "src/main.rs"

[dependencies]
zona-p2p-server = { workspace = true }
zona-p2p-crypto = { workspace = true }
tokio           = { workspace = true }
axum            = { workspace = true }
# rustls + webpki-roots alone can fail in some Docker/DNS setups; native roots use /etc/ssl/certs (ca-certificates).
reqwest         = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
base64          = { workspace = true }
hex             = { workspace = true }
anyhow          = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
clap            = { workspace = true }
