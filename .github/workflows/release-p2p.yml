name: Build and Release P2P Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for release (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-x64

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build zona node (script)
        shell: pwsh
        run: ./scripts/build-p2p.ps1 -Crate zona-p2p-node

      - name: Build proxy server (script)
        shell: pwsh
        run: ./scripts/build-p2p.ps1 -Crate proxy-server

      - name: Build zona dns (script)
        shell: pwsh
        run: ./scripts/build-p2p.ps1 -Crate zona-dns

      - name: Package binaries (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="release/${{ matrix.platform }}"
          mkdir -p "$STAGE_DIR"

          BIN_DIR="${HOME}/.cache/zona-cargo-target-p2p/release"
          cp "${BIN_DIR}/zona-p2p" "$STAGE_DIR/"
          cp "${BIN_DIR}/proxy-server" "$STAGE_DIR/"
          cp "${BIN_DIR}/zona-dns" "$STAGE_DIR/"

          chmod +x "$STAGE_DIR/zona-p2p" "$STAGE_DIR/proxy-server" "$STAGE_DIR/zona-dns"
          tar -czf "zona-p2p-${{ matrix.platform }}.tar.gz" -C release "${{ matrix.platform }}"

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "release/${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $binDir = Join-Path $env:LOCALAPPDATA "Zona/cargo-target-p2p/release"
          Copy-Item (Join-Path $binDir "zona-p2p.exe") "$stageDir/"
          Copy-Item (Join-Path $binDir "proxy-server.exe") "$stageDir/"
          Copy-Item (Join-Path $binDir "zona-dns.exe") "$stageDir/"

          Compress-Archive -Path "$stageDir/*" -DestinationPath "zona-p2p-${{ matrix.platform }}.zip" -Force

      - name: Upload archive (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zona-p2p-${{ matrix.platform }}
          path: zona-p2p-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

      - name: Upload archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zona-p2p-${{ matrix.platform }}
          path: zona-p2p-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
